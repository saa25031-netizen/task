<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - タスク管理アプリ</title>
    <script>
        // Intercept and suppress Tailwind CDN production warning for a clean console
        const originalConsoleWarn = console.warn;
        console.warn = function(...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) {
                return;
            }
            originalConsoleWarn.apply(console, args);
        };
    </script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-none text-slate-900">TaskFlow</h1>
                    <span class="text-xs text-slate-500">スマートタスク管理</span>
                </div>
            </div>

            <!-- Sync Status Indicator -->
            <div id="sync-status" class="flex items-center space-x-2 bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-medium border border-emerald-200/60">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span>ローカル保存モード (動作良好)</span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Application Workspace -->
        <div id="app-workspace" class="space-y-6">

            <!-- Stats Dashboard -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-500 uppercase">全タスク</p>
                        <h3 id="stat-total" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
                    </div>
                    <div class="w-10 h-10 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center">
                        <i class="fa-solid fa-list-ul"></i>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-500 uppercase">未完了</p>
                        <h3 id="stat-pending" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                    </div>
                    <div class="w-10 h-10 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center">
                        <i class="fa-regular fa-clock"></i>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-500 uppercase">完了済み</p>
                        <h3 id="stat-completed" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                    </div>
                    <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
                        <i class="fa-regular fa-circle-check"></i>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-500 uppercase">高優先度</p>
                        <h3 id="stat-high" class="text-2xl font-bold text-rose-600 mt-1">0</h3>
                    </div>
                    <div class="w-10 h-10 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                </div>
            </div>

            <!-- Filter & Action Controls Bar -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center">
                <!-- Search Box -->
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="タスクを検索..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                </div>

                <!-- Filter Controls -->
                <div class="flex flex-wrap items-center gap-2">
                    <!-- Status Filter -->
                    <select id="filter-status" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべてのステータス</option>
                        <option value="pending">未完了のみ</option>
                        <option value="completed">完了済みのみ</option>
                    </select>

                    <!-- Priority Filter -->
                    <select id="filter-priority" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべての優先度</option>
                        <option value="high">優先度: 高</option>
                        <option value="medium">優先度: 中</option>
                        <option value="low">優先度: 低</option>
                    </select>

                    <!-- Add Task Button -->
                    <button id="btn-open-modal" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-all shadow-sm shadow-blue-500/20">
                        <i class="fa-solid fa-plus"></i>
                        新規タスク
                    </button>
                </div>
            </div>

            <!-- Task List Container -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div id="task-list" class="divide-y divide-slate-100 min-h-[250px]">
                    <!-- Dynamic tasks will be injected here -->
                </div>
                
                <!-- Empty Task State -->
                <div id="empty-state" class="hidden py-16 text-center">
                    <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                        <i class="fa-solid fa-inbox"></i>
                    </div>
                    <p class="text-slate-600 font-medium text-sm">タスクが見つかりません</p>
                    <p class="text-slate-400 text-xs mt-1">新しいタスクを追加するか、フィルターを変更してください。</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Task Modal (Create / Edit) -->
    <div id="task-modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-md w-full overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 id="modal-title" class="font-bold text-lg text-slate-800">新規タスクの追加</h3>
                <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="task-form" class="p-6 space-y-4">
                <input type="hidden" id="task-id">

                <!-- Title Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">タイトル <span class="text-rose-500">*</span></label>
                    <input type="text" id="task-title" required placeholder="タスクの件名を入力..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Description Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">詳細メモ</label>
                    <textarea id="task-desc" rows="3" placeholder="詳細やメモを入力 (任意)..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 custom-scrollbar"></textarea>
                </div>

                <!-- Priority & Due Date -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">優先度</label>
                        <select id="task-priority" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">期限日</label>
                        <input type="date" id="task-duedate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- Category Tag -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">カテゴリ / タグ</label>
                    <input type="text" id="task-category" placeholder="例: 仕事, 買い物, 個人..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Actions -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" id="btn-cancel-modal" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50">キャンセル</button>
                    <button type="submit" id="btn-save-task" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium shadow-sm shadow-blue-500/20">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Application Logic (LocalStorage Persisted, Zero External Auth Calls) -->
    <script>
        // Application State
        let tasksData = [];

        // DOM Elements
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');

        const filterStatus = document.getElementById('filter-status');
        const filterPriority = document.getElementById('filter-priority');
        const searchInput = document.getElementById('search-input');

        const taskModal = document.getElementById('task-modal');
        const taskForm = document.getElementById('task-form');
        const modalTitle = document.getElementById('modal-title');
        const taskIdInput = document.getElementById('task-id');
        const btnOpenModal = document.getElementById('btn-open-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnCancelModal = document.getElementById('btn-cancel-modal');

        // Toast Manager
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = type === 'error' ? 'bg-rose-600 text-white' : 
                            type === 'success' ? 'bg-emerald-600 text-white' : 
                            'bg-slate-800 text-white';
            
            toast.className = `px-4 py-3 rounded-xl shadow-lg text-sm font-medium ${bgClass} transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto flex items-center gap-2`;
            
            const icon = type === 'error' ? 'fa-triangle-exclamation' :
                         type === 'success' ? 'fa-circle-check' : 'fa-info-circle';
                         
            toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // LocalStorage Management
        function loadFromLocalStorage() {
            try {
                const stored = localStorage.getItem('taskflow_tasks');
                if (stored) {
                    tasksData = JSON.parse(stored);
                } else {
                    tasksData = [];
                }
            } catch (e) {
                tasksData = [];
            }
            sortAndRenderTasks();
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('taskflow_tasks', JSON.stringify(tasksData));
            } catch (e) {
                showToast('保存中にエラーが発生しました', 'error');
            }
            sortAndRenderTasks();
        }

        function sortAndRenderTasks() {
            tasksData.sort((a, b) => {
                if (a.completed !== b.completed) {
                    return a.completed ? 1 : -1;
                }
                const timeA = a.createdAt || 0;
                const timeB = b.createdAt || 0;
                return timeB - timeA;
            });

            renderTasks();
            updateStats();
        }

        // Load tasks from LocalStorage when page loads
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
        });

        // Render Dashboard Stats
        function updateStats() {
            const total = tasksData.length;
            const completed = tasksData.filter(t => t.completed).length;
            const pending = total - completed;
            const high = tasksData.filter(t => t.priority === 'high' && !t.completed).length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-completed').textContent = completed;
            document.getElementById('stat-high').textContent = high;
        }

        // Filter and Search Logic
        function getFilteredTasks() {
            const statusVal = filterStatus.value;
            const priorityVal = filterPriority.value;
            const searchVal = searchInput.value.toLowerCase().trim();

            return tasksData.filter(task => {
                if (statusVal === 'pending' && task.completed) return false;
                if (statusVal === 'completed' && !task.completed) return false;

                if (priorityVal !== 'all' && task.priority !== priorityVal) return false;

                if (searchVal) {
                    const matchTitle = task.title?.toLowerCase().includes(searchVal);
                    const matchDesc = task.description?.toLowerCase().includes(searchVal);
                    const matchCat = task.category?.toLowerCase().includes(searchVal);
                    if (!matchTitle && !matchDesc && !matchCat) return false;
                }

                return true;
            });
        }

        // Render Task Items
        function renderTasks() {
            const filtered = getFilteredTasks();
            taskList.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            filtered.forEach(task => {
                const item = document.createElement('div');
                item.className = `p-4 hover:bg-slate-50/80 transition-colors flex items-start gap-4 ${task.completed ? 'opacity-60 bg-slate-50/40' : ''}`;
                
                let priorityBadge = '';
                if (task.priority === 'high') {
                    priorityBadge = '<span class="px-2 py-0.5 text-xs font-semibold rounded bg-rose-100 text-rose-700">高</span>';
                } else if (task.priority === 'medium') {
                    priorityBadge = '<span class="px-2 py-0.5 text-xs font-semibold rounded bg-amber-100 text-amber-700">中</span>';
                } else {
                    priorityBadge = '<span class="px-2 py-0.5 text-xs font-semibold rounded bg-slate-100 text-slate-600">低</span>';
                }

                const catTag = task.category ? `<span class="px-2 py-0.5 text-xs font-medium rounded-full bg-blue-50 text-blue-600"><i class="fa-solid fa-tag text-[10px] mr-1"></i>${escapeHtml(task.category)}</span>` : '';

                let dueDateText = '';
                if (task.dueDate) {
                    const isOverdue = !task.completed && new Date(task.dueDate) < new Date().setHours(0,0,0,0);
                    dueDateText = `<span class="text-xs ${isOverdue ? 'text-rose-600 font-semibold' : 'text-slate-400'}"><i class="fa-regular fa-calendar mr-1"></i>${task.dueDate}</span>`;
                }

                item.innerHTML = `
                    <button class="btn-toggle-status mt-1 text-slate-300 hover:text-blue-600 transition-colors" data-id="${task.id}" data-completed="${task.completed}">
                        ${task.completed ? 
                            '<i class="fa-solid fa-circle-check text-xl text-emerald-500"></i>' : 
                            '<i class="fa-regular fa-circle text-xl"></i>'}
                    </button>
                    <div class="flex-1 min-w-0">
                        <div class="flex flex-wrap items-center gap-2 mb-1">
                            <h4 class="font-semibold text-slate-900 text-base ${task.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(task.title)}</h4>
                            ${priorityBadge}
                            ${catTag}
                        </div>
                        ${task.description ? `<p class="text-sm text-slate-600 mb-2 whitespace-pre-line ${task.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(task.description)}</p>` : ''}
                        ${dueDateText}
                    </div>
                    <div class="flex items-center space-x-1">
                        <button class="btn-edit-task p-2 text-slate-400 hover:text-blue-600 rounded-lg hover:bg-slate-100 transition-colors" data-id="${task.id}">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button class="btn-delete-task p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-100 transition-colors" data-id="${task.id}">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;

                taskList.appendChild(item);
            });

            document.querySelectorAll('.btn-toggle-status').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const currentCompleted = btn.dataset.completed === 'true';
                    toggleTaskStatus(id, !currentCompleted);
                });
            });

            document.querySelectorAll('.btn-edit-task').forEach(btn => {
                btn.addEventListener('click', () => openEditModal(btn.dataset.id));
            });

            document.querySelectorAll('.btn-delete-task').forEach(btn => {
                btn.addEventListener('click', () => deleteTask(btn.dataset.id));
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // Modal Controls
        function openCreateModal() {
            modalTitle.textContent = '新規タスクの追加';
            taskIdInput.value = '';
            taskForm.reset();
            document.getElementById('task-priority').value = 'medium';
            taskModal.classList.remove('hidden');
        }

        function openEditModal(id) {
            const task = tasksData.find(t => t.id === id);
            if (!task) return;

            modalTitle.textContent = 'タスクの編集';
            taskIdInput.value = task.id;
            document.getElementById('task-title').value = task.title || '';
            document.getElementById('task-desc').value = task.description || '';
            document.getElementById('task-priority').value = task.priority || 'medium';
            document.getElementById('task-duedate').value = task.dueDate || '';
            document.getElementById('task-category').value = task.category || '';

            taskModal.classList.remove('hidden');
        }

        function closeModal() {
            taskModal.classList.add('hidden');
            taskForm.reset();
        }

        btnOpenModal.addEventListener('click', openCreateModal);
        btnCloseModal.addEventListener('click', closeModal);
        btnCancelModal.addEventListener('click', closeModal);

        // Save Task
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const id = taskIdInput.value;
            const title = document.getElementById('task-title').value.trim();
            const description = document.getElementById('task-desc').value.trim();
            const priority = document.getElementById('task-priority').value;
            const dueDate = document.getElementById('task-duedate').value;
            const category = document.getElementById('task-category').value.trim();

            if (!title) {
                showToast('タイトルを入力してください', 'error');
                return;
            }

            if (id) {
                const index = tasksData.findIndex(t => t.id === id);
                if (index !== -1) {
                    tasksData[index] = {
                        ...tasksData[index],
                        title,
                        description,
                        priority,
                        dueDate,
                        category,
                        updatedAt: Date.now()
                    };
                }
                showToast('タスクを更新しました', 'success');
            } else {
                const newTask = {
                    id: Date.now().toString(),
                    title,
                    description,
                    priority,
                    dueDate,
                    category,
                    completed: false,
                    createdAt: Date.now()
                };
                tasksData.push(newTask);
                showToast('新しいタスクを追加しました', 'success');
            }

            saveToLocalStorage();
            closeModal();
        });

        // Toggle Task Completed Status
        function toggleTaskStatus(id, completed) {
            const task = tasksData.find(t => t.id === id);
            if (task) {
                task.completed = completed;
                saveToLocalStorage();
            }
        }

        // Delete Task
        function deleteTask(id) {
            tasksData = tasksData.filter(t => t.id !== id);
            saveToLocalStorage();
            showToast('タスクを削除しました', 'info');
        }

        // Filter and Search Event Listeners
        filterStatus.addEventListener('change', renderTasks);
        filterPriority.addEventListener('change', renderTasks);
        searchInput.addEventListener('input', renderTasks);
    </script>
</body>
</html>
